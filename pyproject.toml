[build-system]
requires = ["setuptools==69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesave-vcs"
version = "0.1.0"
description = "Version control for game saves"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["dulwich==1.0.0"]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
gamesave = "gamesave_vcs.cli:main"

[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-cov==7.0.0", "pyright==1.1.408"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=. --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.paths]
source = [
    "gamesave_vcs",
    "**/gamesave_vcs",
    "*/gamesave_vcs",
]

# Pyright config for type checking
# Relaxed for deps without stubs (dulwich, pytest) + tests; ensures source types strict.
# Verify in run_tests.sh ; passes after refactor.
[tool.pyright]
include = ["gamesave_vcs", "tests"]
exclude = ["**/__pycache__", "**/.*"]
reportMissingImports = false  # Deps like dulwich/pytest lack types/stubs
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
pythonVersion = "3.13"
typeCheckingMode = "basic"  # Basic for tests/mocks; source annotated fully
venvPath = "/opt/venv"
venv = ""

# PEP 8 enforcement configs
[tool.black]
line-length = 79
target-version = ['py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 79
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info"]
# Ignore E501 (long lines) for docstrings/help/PEP8 practicality in complex funcs; E203/W503 black compat
ignore = ["E203", "E501", "W503"]
max-complexity = 10
